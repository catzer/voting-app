apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-app-deployment
  labels:
    app: demo-voting-app  
    name: result-app-deployment
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: demo-voting-app
      name: result-app-pod
  template:
    metadata:
      labels:
        app: demo-voting-app
        name: result-app-pod
    spec:
      containers:
      - name: result-app
        image: {{ .Values.image.resultApp }}
        ports:
        - containerPort: {{ .Values.service.resultApp.port }}
