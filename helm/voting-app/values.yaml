replicaCount: 1

image:
  postgres: postgres:latest
  redis: redis:latest
  votingApp: dockersamples/examplevotingapp_vote:latest
  workerApp: dockersamples/examplevotingapp_worker:latest
  resultApp: dockersamples/examplevotingapp_result:latest

service:
  votingApp:
    type: NodePort
    port: 80
  resultApp:
    type: NodePort
    port: 80
  postgres:
    port: 5432
  redis:
    port: 6379
  postgresClusterIP:
    type: ClusterIP
    port: 5432
  redisClusterIP:
    type: ClusterIP
    port: 6379